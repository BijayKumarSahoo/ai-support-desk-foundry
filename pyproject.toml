[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "supportdesk-ai"
version = "0.1.0"
description = "AI-powered technical support assistant using Microsoft Foundry"
requires-python = ">=3.10"
dependencies = [
    "azure-ai-projects>=2.3.0,<3.0.0",
    "azure-identity>=1.18.0,<2.0.0",
    "openai>=3.0.0,<4.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "ruff>=0.11,<1",
]

[project.scripts]
supportdesk-ai = "supportdesk_ai.main:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"